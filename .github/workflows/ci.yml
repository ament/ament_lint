name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        module:
          - ament_clang_format
          - ament_clang_tidy
          - ament_cmake_clang_format
          - ament_cmake_clang_tidy
          - ament_cmake_copyright
          - ament_cmake_cppcheck
          - ament_cmake_cpplint
          - ament_cmake_flake8
          - ament_cmake_lint_cmake
          - ament_cmake_mypy
          - ament_cmake_pclint
          - ament_cmake_pep257
          - ament_cmake_pycodestyle
          - ament_cmake_pyflakes
          - ament_cmake_uncrustify
          - ament_cmake_xmllint
          - ament_copyright
          - ament_cppcheck
          - ament_cpplint
          - ament_flake8
          - ament_lint
          - ament_lint_auto
          - ament_lint_cmake
          - ament_lint_common
          - ament_mypy
          - ament_pclint
          - ament_pep257
          - ament_pycodestyle
          - ament_pyflakes
          - ament_uncrustify
          - ament_xmllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
            submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install --upgrade pip
      - run: pip install pytest
      - run: |
          cd ${{ matrix.module }}
          pip install --editable .
          pytest
